name: Shell regression checks

on:
  push:
  pull_request:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate installer syntax
        run: |
          bash -n install.sh
          bash -n mihomo-anytls-install.sh
          bash -n tools/configure-outbound-proxy.sh
      - name: Check config writer dispatch
        run: bash tests/test-installer-config-writer.sh
      - name: Check entrypoint wrapper
        run: bash tests/test-entrypoint-wrapper.sh
      - name: Check custom certificate path handling
        run: bash tests/test-custom-cert.sh

      - name: Check GateVPN SOCKS5 UDP behavior
        run: bash tests/test-outbound-socks5-udp.sh
