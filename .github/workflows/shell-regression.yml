name: Shell regression checks

on:
  push:
  pull_request:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate installer syntax
        run: bash -n mihomo-anytls-install.sh
      - name: Check config writer dispatch
        run: bash tests/test-installer-config-writer.sh
